<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serverless Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- Join Screen                    -->
    <!-- ============================= -->

    <section id="join-screen" class="screen">

        <div class="join-card">

            <div class="logo">
                ⚡
            </div>

            <h1>Serverless Chat</h1>

            <p class="subtitle">
                Real-time messaging powered by AWS
            </p>

            <form id="join-form">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    maxlength="100"
                    required
                >

                <label for="room">
                    Room
                </label>

                <select id="room">
                    <option value="general">General</option>
                    <option value="development">Development</option>
                    <option value="random">Random</option>
                </select>

                <button type="submit">
                    Join Chat
                </button>

            </form>

            <div id="join-error" class="error"></div>

        </div>

    </section>


    <!-- ============================= -->
    <!-- Chat Screen                    -->
    <!-- ============================= -->

    <section id="chat-screen" class="screen hidden">

        <div class="chat-container">

            <!-- Header -->

            <header class="chat-header">

                <div>
                    <h2>⚡ Serverless Chat</h2>

                    <span id="current-room">
                        # general
                    </span>
                </div>

                <div class="connection-status">

                    <span
                        id="status-indicator"
                        class="status-dot"
                    ></span>

                    <span id="connection-status">
                        Connecting...
                    </span>

                </div>

            </header>


            <!-- Main Chat -->

            <main class="chat-main">

                <aside class="sidebar">

                    <h3>Rooms</h3>

                    <button
                        class="room-button active"
                        data-room="general"
                    >
                        # general
                    </button>

                    <button
                        class="room-button"
                        data-room="development"
                    >
                        # development
                    </button>

                    <button
                        class="room-button"
                        data-room="random"
                    >
                        # random
                    </button>

                </aside>


                <section class="messages-section">

                    <div
                        id="messages"
                        class="messages"
                    ></div>

                    <div
                        id="typing-indicator"
                        class="typing-indicator"
                    ></div>

                    <form
                        id="message-form"
                        class="message-form"
                    >

                        <input
                            type="text"
                            id="message-input"
                            placeholder="Type a message..."
                            autocomplete="off"
                            maxlength="2000"
                        >

                        <button type="submit">
                            ➤
                        </button>

                    </form>

                </section>

            </main>

        </div>

    </section>


    <script src="app.js"></script>

</body>

</html>
