<!-- ============================= -->
<!-- Chat Screen                   -->
<!-- ============================= -->

<section id="chat-screen" class="screen hidden">

    <div class="chat-container">

        <!-- Header -->

        <header class="chat-header">

            <div class="header-left">

                <!-- Mobile / Back Button -->

                <button
                    id="back-button"
                    class="back-button"
                    type="button"
                    aria-label="Back"
                >
                    ←
                </button>

                <div class="chat-logo">
                    ⚡
                </div>

                <div class="header-info">

                    <h2>Serverless Chat</h2>

                    <span id="current-room">
                        # general
                    </span>

                </div>

            </div>


            <div class="connection-status">

                <span
                    id="status-indicator"
                    class="status-dot"
                ></span>

                <span id="connection-status">
                    Connecting...
                </span>

            </div>

        </header>


        <!-- Main Chat -->

        <main class="chat-main">

            <!-- Sidebar -->

            <aside class="sidebar">

                <div class="sidebar-header">

                    <h3>Rooms</h3>

                </div>


                <button
                    class="room-button active"
                    data-room="general"
                >
                    <span>#</span>
                    <span>general</span>
                </button>


                <button
                    class="room-button"
                    data-room="development"
                >
                    <span>#</span>
                    <span>development</span>
                </button>


                <button
                    class="room-button"
                    data-room="random"
                >
                    <span>#</span>
                    <span>random</span>
                </button>

            </aside>


            <!-- Messages -->

            <section class="messages-section">

                <div
                    id="messages"
                    class="messages"
                >

                    <!-- Empty state is controlled by JS -->

                </div>


                <div
                    id="typing-indicator"
                    class="typing-indicator"
                ></div>


                <!-- Message Input -->

                <form
                    id="message-form"
                    class="message-form"
                >

                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                        maxlength="2000"
                    >


                    <button
                        type="submit"
                        id="send-button"
                        aria-label="Send message"
                    >
                        ➤
                    </button>

                </form>

            </section>

        </main>

    </div>

</section>
