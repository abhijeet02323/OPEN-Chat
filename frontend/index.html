<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serverless Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============================= -->
    <!-- Join Screen                    -->
    <!-- ============================= -->

    <section id="join-screen" class="screen">

        <div class="join-card">

            <div class="logo">
                ⚡
            </div>

            <h1>Serverless Chat</h1>

            <p class="subtitle">
                Real-time messaging powered by AWS
            </p>

            <div class="auth-tabs" role="tablist" aria-label="Authentication">
                <button id="login-tab" class="auth-tab active" type="button" role="tab" aria-selected="true">
                    Log in
                </button>
                <button id="register-tab" class="auth-tab" type="button" role="tab" aria-selected="false">
                    Register
                </button>
            </div>

            <form id="login-form" class="auth-form">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    maxlength="100"
                    required
                >

                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Join Chat
                </button>

            </form>

            <form id="register-form" class="auth-form hidden">

                <label for="register-username">
                    Username
                </label>

                <input
                    type="text"
                    id="register-username"
                    placeholder="3–30 letters, numbers, - or _"
                    minlength="3"
                    maxlength="30"
                    pattern="[A-Za-z0-9_-]+"
                    required
                >

                <label for="register-password">
                    Password
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

                <label for="confirm-password">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Enter your password again"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Create account
                </button>

            </form>

            <div id="join-error" class="error"></div>

        </div>

    </section>


<!-- ============================= -->
<!-- Chat Screen                   -->
<!-- ============================= -->

<section id="chat-screen" class="screen hidden">

    <div class="chat-container">

        <!-- Header -->

        <header class="chat-header">

            <div class="header-left">

                <!-- Mobile / Back Button -->

                <button
                    id="back-button"
                    class="back-button"
                    type="button"
                    aria-label="Back"
                >
                    ←
                </button>

                <div class="chat-logo">
                    ⚡
                </div>

                <div class="header-info">

                    <h2>Serverless Chat</h2>

                    <span id="current-room">
                        # general
                    </span>

                    <button id="logout-button" class="logout-button" type="button">
                        Log out
                    </button>

                </div>

            </div>


            <div class="connection-status">

                <span
                    id="status-indicator"
                    class="status-dot"
                ></span>

                <span id="connection-status">
                    Connecting...
                </span>

            </div>

        </header>


        <!-- Main Chat -->

        <main class="chat-main">

            <!-- Sidebar -->

            <aside class="sidebar">

                <div class="sidebar-header">

                    <h3>Rooms</h3>

                </div>

                <div id="room-list" class="room-list">


                <button
                    class="room-button active"
                    data-room="general"
                >
                    <span>#</span>
                    <span>general</span>
                </button>


                <button
                    class="room-button"
                    data-room="development"
                >
                    <span>#</span>
                    <span>development</span>
                </button>


                <button
                    class="room-button"
                    data-room="random"
                >
                    <span>#</span>
                    <span>random</span>
                </button>

                </div>

                <form id="new-room-form" class="new-room-form">
                    <label class="sr-only" for="new-room-input">
                        New room name
                    </label>

                    <input
                        id="new-room-input"
                        type="text"
                        maxlength="50"
                        placeholder="Create a room"
                        autocomplete="off"
                    >

                    <button type="submit" aria-label="Create room">
                        +
                    </button>
                </form>

            </aside>


            <!-- Messages -->

            <section class="messages-section">

                <div
                    id="messages"
                    class="messages"
                >

                    <!-- Empty state is controlled by JS -->

                </div>


                <div
                    id="typing-indicator"
                    class="typing-indicator"
                ></div>

                <button
                    id="new-messages-button"
                    class="new-messages-button hidden"
                    type="button"
                >
                    ↓ New messages
                </button>


                <!-- Message Input -->

                <form
                    id="message-form"
                    class="message-form"
                >

                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type a message..."
                        autocomplete="off"
                        maxlength="2000"
                    >


                    <button
                        type="submit"
                        id="send-button"
                        aria-label="Send message"
                    >
                        ➤
                    </button>

                </form>

            </section>

        </main>

    </div>

</section>
<script src="app.js"></script>

</body>
</html>
